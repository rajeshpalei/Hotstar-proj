apiVersion: apps/v1
kind: Deployment
metadata:
 name: hotstar
 namespace: Hotstar
 labels:
  env: prod
  app: hotstar
spec:
 replicas: 3
 selector:
  matchLabels:
   app: hotstar
 template:
  metadata:
   labels:
    app: hotstar
  spec:
   containers:
    - name: Hotsar
      image: rajeshpalei/hotstar:latest
      ports:
       - containerPort: 8080
...
apiVersion: v1
kind: Service
metadata:
 name: hotstar
 namespace: Hotstar
spec:
 type: NodePort
 selector:
  app: hotstar
 ports:
  - port: 80
    targetPort: 8080
    nodePort: 32456
...
    

