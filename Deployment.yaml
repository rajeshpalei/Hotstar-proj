apiVersion: apps/v1
kind: Deployment
metadata:
 name: hotstar
 namespace: hotstar
 labels:
  env: prod
  app: hotstar
spec:
 replicas: 3
 selector:
  matchLabels:
   app: hotstar
 template:
  metadata:
   labels:
    app: hotstar
  spec:
   containers:
    - name: hotstar
      image: rajeshpalei/hotstar:memory-leak-v1
      ports:
       - containerPort: 8080
      resources:
       requests:
         memory: "124Mi"
       limits:
         memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
 name: hotstar
 namespace: hotstar
spec:
 type: NodePort
 selector:
  app: hotstar
 ports:
  - port: 80
    targetPort: 8080
    nodePort: 32456
...
    

